name: CI

# Task 1: runs on every push to any branch.
# Bonus: a matrix runs the lint job across Node 18/20 and ubuntu/macos (4 parallel jobs).
on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Let every combination finish so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        node-version: [18, 20]
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
